version: "3.8"

services:

  postgres_db:
    image: postgres:15-alpine
    container_name: ats_postgres_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_db_secure_password_here
      POSTGRES_DB: job_ats_db
    ports:
      - "5402:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ats_backend_container
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:your_db_secure_password_here@postgres_db:5432/job_ats_db?schema=public"
      JWT_SECRET: "YOUR_COMPUTED_64_BYTE_HEX_STRING_HERE"
    depends_on:
      - postgres_db

  frontend_client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ats_frontend_container
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend_api

volumes:
  pgdata: